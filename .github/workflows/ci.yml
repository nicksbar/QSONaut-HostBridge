name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: ${{ matrix.target }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Validate workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets --target ${{ matrix.target }}
      - run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --workspace --all-targets --target ${{ matrix.target }}
      - run: cargo build --locked --release -p qsonaut-hostbridge-app --target ${{ matrix.target }}
