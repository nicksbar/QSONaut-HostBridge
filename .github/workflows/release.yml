name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

env:
  PACKAGE_NAME: qsonaut-hostbridge-app

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Match tag to workspace version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "qsonaut-hostbridge-app") | .version')"
          [[ "${RELEASE_TAG#v}" == "$package_version" ]] || {
            echo "Tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          }

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked
      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            cross build --locked --release -p "$PACKAGE_NAME" --target "${{ matrix.target }}"
          else
            cargo build --locked --release -p "$PACKAGE_NAME" --target "${{ matrix.target }}"
          fi
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          artifact="${PACKAGE_NAME}-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir "$artifact"
          cp "target/${{ matrix.target }}/release/${PACKAGE_NAME}" "$artifact/"
          cp README.md LICENSE "$artifact/"
          tar -czf "${artifact}.tar.gz" "$artifact"
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $artifact = "$env:PACKAGE_NAME-$env:RELEASE_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $artifact | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:PACKAGE_NAME.exe" "$artifact/"
          Copy-Item README.md, LICENSE "$artifact/"
          Compress-Archive -Path $artifact -DestinationPath "$artifact.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: hostbridge-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: hostbridge-*
          merge-multiple: true
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "QSONaut HostBridge $RELEASE_TAG"

