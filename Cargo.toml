[workspace]
members = [
    "crates/qsonaut-hostbridge-protocol",
    "crates/qsonaut-hostbridge",
    "apps/qsonaut-hostbridge",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["QSONaut Contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
qsonaut-hostbridge = { path = "crates/qsonaut-hostbridge" }
rigwright = "0.1.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
